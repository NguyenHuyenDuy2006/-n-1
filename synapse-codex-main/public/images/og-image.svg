<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#020617"/>
      <stop offset="50%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6366f1"/>
      <stop offset="100%" stopColor="#14b8a6"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6366f1"/>
      <stop offset="50%" stopColor="#818cf8"/>
      <stop offset="100%" stopColor="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Logo -->
  <g transform="translate(100, 100)">
    <path d="M4 16C4 10.97 8.97 6 14 6C19.03 6 24 10.97 24 16C24 21.03 19.03 26 14 26C8.97 26 4 21.03 4 16Z" stroke="url(#logoGradient)" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"/>
    <path d="M14 6V26" stroke="url(#logoGradient)" strokeWidth="3" strokeLinecap="round"/>
    <path d="M4 16H24" stroke="url(#logoGradient)" strokeWidth="3" strokeLinecap="round"/>
    <circle cx="14" cy="6" r="4" fill="url(#logoGradient)"/>
    <circle cx="14" cy="26" r="4" fill="url(#logoGradient)"/>
    <circle cx="4" cy="16" r="4" fill="url(#logoGradient)"/>
    <circle cx="24" cy="16" r="4" fill="url(#logoGradient)"/>
  </g>
  
  <!-- Text -->
  <text x="240" y="155" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="white" letter-spacing="-0.5px">Synapse Codex</text>
  <text x="240" y="210" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8">Đối tác công nghệ cho doanh nghiệp Việt Nam</text>
  
  <!-- Tagline -->
  <text x="100" y="380" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="white" letter-spacing="-1px">Biến ý tưởng thành những</text>
  <text x="100" y="450" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="url(#textGradient)" letter-spacing="-1px">sản phẩm số</text>
  <text x="100" y="520" font-family="system-ui, sans-serif" font-size="24" fill="#64748b">có thể vận hành và phát triển</text>
</svg>
